services:
  # ============================================================================
  # 1. FastAPI Backend Web Service
  # ============================================================================
  - type: web
    name: aura-jewellery-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PROJECT_NAME
        value: Aura Atelier Luxury Jewellery API
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        value: dhrugar@gmail.com
      - key: ADMIN_PASSWORD
        value: Dragonp@72
      - key: ADMIN_NAME
        value: Aura Atelier Master Admin
      - key: RAZORPAY_KEY_ID
        value: rzp_test_luxurydemo123
      - key: RAZORPAY_KEY_SECRET
        value: secret_luxury_razorpay_mock_key
      - key: FRONTEND_URL
        fromService:
          type: static
          name: aura-jewellery-frontend
          property: url

  # ============================================================================
  # 2. React + Vite Frontend Static Site
  # ============================================================================
  - type: static
    name: aura-jewellery-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aura-jewellery-api
          property: url
          appendPath: /api

