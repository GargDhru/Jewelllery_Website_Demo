services:
  # ============================================================================
  # Single Render Web Service: FastAPI serves both /api/* and the React SPA
  # ============================================================================
  - type: web
    name: aura-jewellery
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PROJECT_NAME
        value: Aura Atelier Luxury Jewellery API
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        value: dhrugar@gmail.com
      - key: ADMIN_PASSWORD
        value: Dragonp@72
      - key: ADMIN_NAME
        value: Aura Atelier Master Admin
      - key: RAZORPAY_KEY_ID
        value: rzp_test_luxurydemo123
      - key: RAZORPAY_KEY_SECRET
        value: secret_luxury_razorpay_mock_key
      # Firebase Cloud Firestore (Paste your serviceAccountKey.json content here in Render Dashboard)
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
